version: '3.8'

services:
  sudarshana-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sudarshana-forensics-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - SUDARSHANA_MODEL_PATH=/app/weights/fusion_best.pt
    volumes:
      - ./weights:/app/weights:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  sudarshana-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sudarshana-forensics-api
    restart: unless-stopped
    command: ["uvicorn", "src.deploy.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SUDARSHANA_MODEL_PATH=/app/weights/fusion_best.pt
    volumes:
      - ./weights:/app/weights:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
